[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Monotoba-DDNSUpdater"
version = "0.0.1.dev0"
description = "Experimental Namecheap dynamic DNS updater"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [{name = "R Morgan"}]
dependencies = ["requests>=2.32,<3"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[project.scripts]
namecheap-ddns = "ddns_updater.ddns_updater:main"

[project.urls]
Repository = "https://github.com/Monotoba/DDNSUpdater"
Issues = "https://github.com/Monotoba/DDNSUpdater/issues"

[tool.setuptools.packages.find]
include = ["ddns_updater*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
